name: Daily breakout scan

on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python scanner.py

      - name: Commit results
        run: |
          git config user.name  "breakout-scanner"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "scan $(date -u +%Y-%m-%d)"
          git push
